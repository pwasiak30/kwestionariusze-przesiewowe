/* --- Przycisk wsparcia (Suppi) — zawsze widoczny --- */
.coffee-fab {
  position: fixed;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 8px;
  right: 16px;
  /* Domyślnie (telefon/tablet, < 1024px) na dole ekranu widoczny jest stały
     pasek zakładek (.bottombar) — podnosimy przycisk ponad niego, żeby go
     nie zasłaniał. Wysokość paska to ok. 56-60px + bezpieczny margines na
     dole ekranu (notch/gesture bar) z env(safe-area-inset-bottom). */
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  background: var(--coral);
  color: #fff7ec;
  text-decoration: none;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  padding: 11px 16px;
  border-radius: 999px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.28);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background .15s ease;
}
.coffee-fab:hover, .coffee-fab:focus-visible {
  background: var(--coral-dark);
  transform: translateY(-2px);
  box-shadow: 0 9px 20px rgba(0,0,0,0.34);
}
.coffee-fab .coffee-icon { font-size: 16px; line-height: 1; }
@media (max-width: 480px) {
  .coffee-fab {
    right: 12px;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    padding: 10px 14px;
    font-size: 13px;
  }
}
/* Pasek zakładek (.bottombar) jest ukrywany dopiero od 1024px (patrz style.css) —
   dopiero od tej szerokości przycisk może zejść niżej, bo nie ma czego zasłaniać. */
@media (min-width: 1024px) {
  .coffee-fab { right: 24px; bottom: 24px; }
}
</style>
</head>

<script>
  (function(){
    var KEY = 'wp-theme';
    function current(){
      var attr = document.documentElement.getAttribute('data-theme');
      if(attr === 'dark' || attr === 'light') return attr;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    var btn = document.getElementById('theme-toggle');
    if(btn){
      btn.addEventListener('click', function(){
        var next = current() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try{ localStorage.setItem(KEY, next); }catch(e){}
      });
    }
  })();
</script>

<p>Wypełnij, a aplikacja automatycznie policzy wynik i przedstawi interpretację zgodną z przyjętymi progami klinicznymi. Działa również offline.</p>
<div class="value-prop">
<span class="value-prop-icon">✓</span>
<p>Aplikacja sama sumuje punkty i pokazuje interpretację zgodną z polskimi normami klinicznymi. Brzmi banalnie, ale w praktyce psycholodzy często muszą to robić ręcznie — sumując punkty na kartce albo w Excelu.</p>
</div>

Narzędzia mają charakter przesiewowy i psychoedukacyjny. Nie zastępują diagnozy klinicznej postawionej przez uprawnionego specjalistę.
Wyniki nie są nigdzie wysyłane ani zapisywane poza urządzeniem, na którym uzupełniany jest kwestionariusz.
</p>
